<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT 007 - Intelligent Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-gold: #d4af37;
            --accent-gold-dim: #a68b2c;
            --glass-bg: rgba(20, 20, 20, 0.9);
            --user-msg-bg: #1a1a1a;
            --ai-msg-bg: #0f0f0f;
            --border-color: #333;
            --header-height: 60px;
            --input-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            flex-shrink: 0;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--accent-gold);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        /* Hamburger Menu */
        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: var(--accent-gold);
            border-radius: 2px;
            transition: transform 0.3s;
        }

        /* Header Controls */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* GitHub Button & Avatar */
        .github-btn {
            background: transparent;
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .github-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            cursor: pointer;
            object-fit: cover;
        }

        /* Model Selector */
        .model-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            text-align: right;
            text-align-last: center;
            width: 150px;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d4af37%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 10px;
            padding-right: 30px;
        }

        /* Sidebar */
        .sidebar {
            position: absolute;
            top: var(--header-height);
            left: 0;
            width: 250px;
            height: calc(100% - var(--header-height));
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--accent-gold-dim);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 90;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: absolute;
            top: var(--header-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--header-height));
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 80;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar h2 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .new-chat-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 5px;
            transition: all 0.2s;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .new-chat-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(5px);
        }

        .new-chat-btn::before {
            content: "+";
            font-size: 1.5rem;
            line-height: 0.8;
            font-weight: bold;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .history-item {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            color: #ccc;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-gold);
        }

        .history-item.active {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            border-left: 2px solid var(--accent-gold);
        }

        .history-item-title {
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            color: #ff4444;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-gold-dim);
            margin: 0;
        }

        .chat-window {
            flex: 1;
            padding: 20px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            padding-bottom: 20px;
        }

        .message {
            max-width: 90%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 95%;
                padding: 12px;
            }
            .chat-window {
                padding: 20px 5px;
            }
            h1 {
                font-size: 1rem;
            }
            .model-select {
                width: 120px;
                font-size: 0.8rem;
            }
            .sidebar {
                width: 70%;
                max-width: 280px;
            }
            /* Hide 'GitHub' text on mobile, keep icon */
            .github-btn span {
                display: none;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            border-right: 3px solid var(--accent-gold);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-left: 3px solid var(--accent-gold);
            width: 100%;
            max-width: 90%;
        }

        .ai-message strong {
            color: var(--accent-gold);
        }

        .code-wrapper {
            position: relative;
            margin: 10px 0;
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
        }

        pre {
            margin: 0;
            padding: 0;
            overflow-x: auto;
        }

        code {
            font-family: 'Consolas', 'Monaco', 'Andale Mono', monospace;
            font-size: 0.9em;
            display: block;
            padding: 15px;
            color: #d4d4d4;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(212, 175, 55, 0.2);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold-dim);
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            opacity: 0.7;
        }

        .copy-btn:hover {
            background: var(--accent-gold);
            color: #000;
            opacity: 1;
        }

        .preview-btn {
            position: absolute;
            top: 5px;
            right: 60px;
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
            border: 1px solid #00aa88;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            opacity: 0.8;
        }

        .preview-btn:hover {
            background: #00ffcc;
            color: #000;
            opacity: 1;
        }

        .input-area {
            flex-shrink: 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--accent-gold);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
            position: relative;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: 5px;
            font-family: inherit;
            outline: none;
            transition: box-shadow 0.3s;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            border-color: var(--accent-gold);
        }

        button#send-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button#send-btn:hover {
            background: #f0c445;
        }

        button#send-btn:active {
            transform: scale(0.98);
        }

        button#send-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            color: var(--accent-gold-dim);
            font-size: 0.8rem;
            padding: 0 20px 10px 20px;
            position: absolute;
            bottom: 70px;
            left: 0;
            background: transparent;
            width: 100%;
            text-align: left;
            pointer-events: none;
        }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .preview-content {
            width: 95%;
            height: 90%;
            background: #1e1e1e;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .preview-header {
            padding: 10px 15px;
            background: #252525;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .close-preview-btn {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .close-preview-btn:hover {
            background: #ff4444;
            color: #fff;
        }

        .preview-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Login Modal */
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-content {
            background: #111;
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }

        .login-content h3 {
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .login-field label {
            color: #888;
            font-size: 0.85rem;
        }

        .login-field input {
            background: #222;
            border: 1px solid #444;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            font-family: inherit;
        }

        .login-field input:focus {
            border-color: var(--accent-gold);
        }

        .login-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn-save {
            flex: 1;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn-cancel {
            flex: 1;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .login-note {
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            line-height: 1.4;
        }

        .login-note a {
            color: var(--accent-gold-dim);
            text-decoration: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gold-dim);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Agent 007</h1>
        <div class="header-controls">
            <button class="github-btn" id="github-btn" onclick="openLoginModal()">
                <svg height="20" viewBox="0 0 16 16" width="20" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                <span>GitHub</span>
            </button>
            <img id="user-avatar" class="user-avatar" style="display: none;" onclick="logoutGitHub()" alt="User Avatar">

            <select class="model-select" id="model-select" aria-label="Select AI Model">
                <option value="copilot-think" selected>Copilot (Think)</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="deepseek-r1">DeepSeek R1</option>
            </select>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <h2>Operations</h2>
        <button class="new-chat-btn" id="new-chat-btn">New Chat</button>
        <div id="history-list" class="history-list">
            <!-- History items will be injected here -->
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="chat-window" id="chat-window">
        <div class="message ai-message">
            Welcome, Agent. How may I assist you today?
        </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">Agent is thinking...</div>

    <form class="input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Type your command..." autocomplete="off" required>
        <button type="submit" id="send-btn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </form>
</div>

<!-- Preview Modal -->
<div class="preview-modal" id="preview-modal">
    <div class="preview-content">
        <div class="preview-header">
            <span class="preview-title">Live Preview</span>
            <button class="close-preview-btn" onclick="closePreview()">Close Mission</button>
        </div>
        <iframe class="preview-frame" id="preview-frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    </div>
</div>

<!-- Login Modal -->
<div class="login-modal" id="login-modal">
    <div class="login-content">
        <h3>GitHub Access</h3>
        <div class="login-field">
            <label>GitHub Username</label>
            <input type="text" id="gh-username" placeholder="e.g. jamesbond007">
        </div>
        <div class="login-field">
            <label>Personal Access Token (PAT)</label>
            <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="login-note">
            Required scopes: <code>repo</code> or <code>public_repo</code>.<br>
            <a href="https://github.com/settings/tokens" target="_blank">Generate Token Here</a>
        </div>
        <div class="login-actions">
            <button class="login-btn-cancel" onclick="closeLoginModal()">Cancel</button>
            <button class="login-btn-save" onclick="saveGitHubCredentials()">Authenticate</button>
        </div>
    </div>
</div>

<script>
    // --- State Management ---
    const userId = localStorage.getItem('agent007_user_id') || `agent_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
    localStorage.setItem('agent007_user_id', userId);

    let currentChatId = null;
    let currentMessages = []; // { role: 'user'|'ai', content: string }
    let chatHistory = [];

    // --- GitHub Login Logic ---
    const loginModal = document.getElementById('login-modal');
    const githubBtn = document.getElementById('github-btn');
    const userAvatar = document.getElementById('user-avatar');

    function openLoginModal() {
        loginModal.style.display = 'flex';
        document.getElementById('gh-username').value = localStorage.getItem('gh_username') || '';
        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    }

    function closeLoginModal() {
        loginModal.style.display = 'none';
    }

    async function saveGitHubCredentials() {
        const username = document.getElementById('gh-username').value.trim();
        const token = document.getElementById('gh-token').value.trim();

        if (!username || !token) {
            alert("Username and Token are required.");
            return;
        }

        localStorage.setItem('gh_username', username);
        localStorage.setItem('gh_token', token);

        await checkGitHubLogin();
        closeLoginModal();
    }

    async function checkGitHubLogin() {
        const username = localStorage.getItem('gh_username');
        const token = localStorage.getItem('gh_token');

        if (username && token) {
            try {
                // Verify token and get avatar
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    githubBtn.style.display = 'none';
                    userAvatar.src = data.avatar_url;
                    userAvatar.style.display = 'block';
                    userAvatar.title = `Logged in as ${data.login}`;
                } else {
                    console.error("GitHub Auth Failed");
                    logoutGitHub(); // Clear invalid creds
                }
            } catch (e) {
                console.error("GitHub Auth Error:", e);
            }
        }
    }

    window.logoutGitHub = function() {
        if (confirm('Disconnect GitHub account?')) {
            localStorage.removeItem('gh_username');
            localStorage.removeItem('gh_token');
            userAvatar.style.display = 'none';
            githubBtn.style.display = 'flex';
        }
    };

    // Close login modal on outside click
    loginModal.addEventListener('click', (e) => {
        if (e.target === loginModal) closeLoginModal();
    });

    // --- Sidebar Logic ---
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const newChatBtn = document.getElementById('new-chat-btn');
    const historyListEl = document.getElementById('history-list');

    function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
        if (sidebar.classList.contains('open')) {
            loadHistoryList(); // Refresh list on open
        }
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', closeSidebar);

    // --- History Logic ---

    async function loadHistoryList() {
        try {
            const res = await fetch(`/api/history?userId=${userId}`);
            if (res.ok) {
                chatHistory = await res.json();
                renderSidebar();
            }
        } catch (e) {
            console.error("Failed to load history:", e);
        }
    }

    function renderSidebar() {
        historyListEl.innerHTML = '';
        if (chatHistory.length === 0) {
            historyListEl.innerHTML = '<div style="padding:10px; color:#666; font-size:0.8rem;">No previous operations.</div>';
            return;
        }

        chatHistory.forEach(chat => {
            const item = document.createElement('div');
            item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;

            const titleSpan = document.createElement('span');
            titleSpan.className = 'history-item-title';
            titleSpan.textContent = chat.title || 'Untitled Operation';

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
            `;
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteChat(chat.id);
            };

            item.appendChild(titleSpan);
            item.appendChild(deleteBtn);

            item.onclick = () => loadChat(chat.id);

            historyListEl.appendChild(item);
        });
    }

    async function deleteChat(chatId) {
        if (!confirm('Are you sure you want to delete this operation record?')) return;

        try {
            const res = await fetch(`/api/history/${chatId}?userId=${userId}`, { method: 'DELETE' });
            if (res.ok) {
                if (currentChatId === chatId) {
                    resetChat(); // Clear view if we deleted the current chat
                }
                loadHistoryList(); // Refresh list
            }
        } catch (e) {
            console.error("Failed to delete chat:", e);
        }
    }

    async function loadChat(chatId) {
        try {
            const res = await fetch(`/api/history/${chatId}?userId=${userId}`);
            if (res.ok) {
                const data = await res.json();
                currentChatId = chatId;
                currentMessages = data.messages || [];

                // Reconstruct Chat Window
                const chatWindow = document.getElementById('chat-window');
                chatWindow.innerHTML = '';

                // Add default welcome if empty (shouldn't happen usually)
                if (currentMessages.length === 0) {
                     chatWindow.innerHTML = `
                        <div class="message ai-message">
                            Welcome, Agent. How may I assist you today?
                        </div>
                    `;
                } else {
                    currentMessages.forEach(msg => {
                        addMessageToUI(msg.content, msg.role === 'user');
                    });
                }

                closeSidebar();
            }
        } catch (e) {
            console.error("Failed to load chat:", e);
        }
    }

    function resetChat() {
        currentChatId = null;
        currentMessages = [];
        const chatWindow = document.getElementById('chat-window');
        chatWindow.innerHTML = `
            <div class="message ai-message">
                Welcome, Agent. How may I assist you today?
            </div>
        `;
        document.getElementById('user-input').focus();
    }

    newChatBtn.addEventListener('click', () => {
        resetChat();
        closeSidebar();
    });

    // --- Markdown & Highlight Configuration ---

    const renderer = new marked.Renderer();

    renderer.code = (token) => {
        let codeStr = token;
        let language = '';

        if (typeof token === 'object' && token !== null) {
            codeStr = token.text || '';
            language = token.lang || '';
        } else if (arguments.length > 1) {
            codeStr = token;
            language = arguments[1];
        }

        codeStr = String(codeStr);
        const validLang = !!(language && hljs.getLanguage(language));

        let highlighted;
        try {
            highlighted = validLang
                ? hljs.highlight(codeStr, { language }).value
                : hljs.highlightAuto(codeStr).value;
        } catch (e) {
            console.error("Highlighting failed:", e);
            highlighted = codeStr;
        }

        const isHtml = language === 'html' || language === 'xml';
        const previewBtn = isHtml ? `<button class="preview-btn" onclick="previewCode(this)">Preview</button>` : '';

        return `
            <div class="code-wrapper">
                ${previewBtn}
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                <pre><code class="hljs ${language || ''}">${highlighted}</code></pre>
            </div>
        `;
    };

    marked.use({ renderer });

    // --- Preview Logic ---
    const previewModal = document.getElementById('preview-modal');
    const previewFrame = document.getElementById('preview-frame');

    window.previewCode = function(btn) {
        const wrapper = btn.closest('.code-wrapper');
        const codeBlock = wrapper.querySelector('code');
        const htmlContent = codeBlock.innerText; // Get raw text

        previewFrame.srcdoc = htmlContent;
        previewModal.style.display = 'flex';
    };

    window.closePreview = function() {
        previewModal.style.display = 'none';
        previewFrame.srcdoc = ''; // Clear content
    };

    previewModal.addEventListener('click', (e) => {
        if (e.target === previewModal) closePreview();
    });

    // --- Chat Logic ---

    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const modelSelect = document.getElementById('model-select');

    function addMessageToUI(content, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;

        if (isUser) {
            msgDiv.textContent = content;
        } else {
            msgDiv.innerHTML = marked.parse(content);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function saveCurrentChat() {
        if (currentMessages.length === 0) return;

        if (!currentChatId) {
            currentChatId = Date.now().toString();
        }

        const firstMsg = currentMessages.find(m => m.role === 'user');
        const title = firstMsg ? (firstMsg.content.substring(0, 30) + (firstMsg.content.length > 30 ? '...' : '')) : 'New Operation';

        try {
            await fetch(`/api/history/${currentChatId}?userId=${userId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: currentMessages,
                    title: title
                })
            });
        } catch (e) {
            console.error("Failed to save chat:", e);
        }
    }

    window.copyCode = function(btn) {
        const wrapper = btn.closest('.code-wrapper');
        const codeBlock = wrapper.querySelector('code');
        const text = codeBlock.innerText;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy:', err);
            btn.textContent = 'Error';
        });
    };

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        const selectedModel = modelSelect.value;

        // Add to UI and State
        addMessageToUI(message, true);
        currentMessages.push({ role: 'user', content: message });

        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: message,
                    model: selectedModel
                })
            });

            const data = await response.json();

            let aiResponseText = "";
            if (data.status && data.result && data.result.response) {
                aiResponseText = data.result.response;
            } else {
                aiResponseText = "Error: Mission Failed. Unable to retrieve intelligence.";
                console.error("API Error:", data);
            }

            // Add to UI and State
            addMessageToUI(aiResponseText, false);
            currentMessages.push({ role: 'ai', content: aiResponseText });

            // Save Chat
            await saveCurrentChat();

        } catch (error) {
            addMessageToUI("Communication Error: Signal Lost.", false);
            console.error("Network Error:", error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            typingIndicator.style.display = 'none';
            userInput.focus();
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    });

    // Initial Load
    checkGitHubLogin(); // Check for existing token
    loadHistoryList();
</script>

</body>
</html>
