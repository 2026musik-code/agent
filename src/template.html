<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT 007 - Intelligent Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-gold: #d4af37;
            --accent-gold-dim: #a68b2c;
            --glass-bg: rgba(20, 20, 20, 0.9);
            --user-msg-bg: #1a1a1a;
            --ai-msg-bg: #0f0f0f;
            --border-color: #333;
            --header-height: 60px;
            --input-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100dvh; /* Use dynamic viewport height for mobile */
            width: 100vw;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            flex-shrink: 0; /* Prevent header from shrinking */
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--accent-gold);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        /* Hamburger Menu */
        .menu-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 30px;
            height: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
        }

        .menu-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: var(--accent-gold);
            border-radius: 2px;
            transition: transform 0.3s;
        }

        /* Model Selector */
        .model-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            appearance: none; /* Hide default arrow */
            -webkit-appearance: none;
            text-align: right;
            text-align-last: center;
            width: 150px;
            /* Custom dropdown arrow */
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23d4af37%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 10px;
            padding-right: 30px;
        }

        .model-select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        /* Sidebar */
        .sidebar {
            position: absolute;
            top: var(--header-height);
            left: 0;
            width: 250px;
            height: calc(100% - var(--header-height));
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--accent-gold-dim);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 90;
            padding: 20px;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-overlay {
            position: absolute;
            top: var(--header-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--header-height));
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 80;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar h2 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .new-chat-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(5px);
        }

        .new-chat-btn::before {
            content: "+";
            font-size: 1.5rem;
            line-height: 0.8;
            font-weight: bold;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-gold-dim);
            margin: 0;
        }

        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            padding-bottom: 20px;
        }

        .message {
            max-width: 85%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 95%;
                padding: 12px;
            }
            h1 {
                font-size: 1rem;
            }
            .model-select {
                width: 120px;
                font-size: 0.8rem;
            }
            .sidebar {
                width: 80%;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            border-right: 3px solid var(--accent-gold);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-left: 3px solid var(--accent-gold);
            width: 100%;
            max-width: 90%;
        }

        .ai-message strong {
            color: var(--accent-gold);
        }

        /* Code Block Styling */
        .code-wrapper {
            position: relative;
            margin: 10px 0;
            background: #1e1e1e;
            border-radius: 6px;
            border: 1px solid #333;
            overflow: hidden;
        }

        pre {
            margin: 0;
            padding: 0;
            overflow-x: auto;
        }

        code {
            font-family: 'Consolas', 'Monaco', 'Andale Mono', monospace;
            font-size: 0.9em;
            display: block;
            padding: 15px;
            color: #d4d4d4;
        }

        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(212, 175, 55, 0.2);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold-dim);
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
            opacity: 0.7;
        }

        .copy-btn:hover {
            background: var(--accent-gold);
            color: #000;
            opacity: 1;
        }

        .input-area {
            flex-shrink: 0; /* Prevent input area from shrinking */
            padding: 15px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--accent-gold);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
            /* Ensure it stays at bottom on all devices */
            position: relative;
            padding-bottom: max(15px, env(safe-area-inset-bottom)); /* iOS safe area */
        }

        input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: 5px;
            font-family: inherit;
            outline: none;
            transition: box-shadow 0.3s;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            border-color: var(--accent-gold);
        }

        button#send-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            transition: background 0.3s, transform 0.1s;
            white-space: nowrap;
        }

        button#send-btn:hover {
            background: #f0c445;
        }

        button#send-btn:active {
            transform: scale(0.98);
        }

        button#send-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: none;
            color: var(--accent-gold-dim);
            font-size: 0.8rem;
            padding: 0 20px 10px 20px;
            position: absolute;
            bottom: 70px;
            left: 0;
            background: transparent;
            width: 100%;
            text-align: left;
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gold-dim);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <h1>Agent 007</h1>
        <select class="model-select" id="model-select" aria-label="Select AI Model">
            <option value="copilot-think" selected>Copilot (Think)</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="deepseek-r1">DeepSeek R1</option>
        </select>
    </header>

    <div class="sidebar" id="sidebar">
        <h2>Operations</h2>
        <button class="new-chat-btn" id="new-chat-btn">New Chat</button>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="chat-window" id="chat-window">
        <div class="message ai-message">
            Welcome, Agent. How may I assist you today?
        </div>
    </div>

    <div class="typing-indicator" id="typing-indicator">Agent is thinking...</div>

    <form class="input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Type your command..." autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
    </form>
</div>

<script>
    // --- Sidebar Logic ---
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const newChatBtn = document.getElementById('new-chat-btn');

    function toggleSidebar() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', closeSidebar);

    // --- New Chat Logic ---
    newChatBtn.addEventListener('click', () => {
        // Clear chat
        const chatWindow = document.getElementById('chat-window');
        chatWindow.innerHTML = `
            <div class="message ai-message">
                Welcome, Agent. How may I assist you today?
            </div>
        `;
        closeSidebar();
        // Reset input focus
        document.getElementById('user-input').focus();
    });

    // --- Markdown & Highlight Configuration ---

    const renderer = new marked.Renderer();

    renderer.code = (token) => {
        let codeStr = token;
        let language = '';

        if (typeof token === 'object' && token !== null) {
            codeStr = token.text || '';
            language = token.lang || '';
        } else if (arguments.length > 1) {
            codeStr = token;
            language = arguments[1];
        }

        codeStr = String(codeStr);
        const validLang = !!(language && hljs.getLanguage(language));

        let highlighted;
        try {
            highlighted = validLang
                ? hljs.highlight(codeStr, { language }).value
                : hljs.highlightAuto(codeStr).value;
        } catch (e) {
            console.error("Highlighting failed:", e);
            highlighted = codeStr;
        }

        return `
            <div class="code-wrapper">
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                <pre><code class="hljs ${language || ''}">${highlighted}</code></pre>
            </div>
        `;
    };

    marked.use({ renderer });

    // --- Chat Logic ---

    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const modelSelect = document.getElementById('model-select');

    function addMessage(content, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;

        if (isUser) {
            msgDiv.textContent = content;
        } else {
            msgDiv.innerHTML = marked.parse(content);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    window.copyCode = function(btn) {
        const wrapper = btn.closest('.code-wrapper');
        const codeBlock = wrapper.querySelector('code');
        const text = codeBlock.innerText;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy:', err);
            btn.textContent = 'Error';
        });
    };

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        const selectedModel = modelSelect.value;

        addMessage(message, true);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: message,
                    model: selectedModel
                })
            });

            const data = await response.json();

            if (data.status && data.result && data.result.response) {
                addMessage(data.result.response, false);
            } else {
                addMessage("Error: Mission Failed. Unable to retrieve intelligence.", false);
                console.error("API Error:", data);
            }

        } catch (error) {
            addMessage("Communication Error: Signal Lost.", false);
            console.error("Network Error:", error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            typingIndicator.style.display = 'none';
            userInput.focus();
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    });
</script>

</body>
</html>
