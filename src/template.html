<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT 007 - Intelligent Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-gold: #d4af37;
            --accent-gold-dim: #a68b2c;
            --glass-bg: rgba(20, 20, 20, 0.8);
            --user-msg-bg: #1a1a1a;
            --ai-msg-bg: #0f0f0f;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Agent/Hacker vibe */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--glass-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            position: relative;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid var(--accent-gold);
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px 10px 0 0;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--accent-gold-dim);
        }

        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            border-right: 3px solid var(--accent-gold);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-left: 3px solid var(--accent-gold);
        }

        .ai-message strong {
            color: var(--accent-gold);
        }

        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--accent-gold);
            display: flex;
            gap: 10px;
            border-radius: 0 0 10px 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #111;
            border: 1px solid var(--accent-gold-dim);
            color: var(--accent-gold);
            padding: 12px;
            border-radius: 5px;
            font-family: inherit;
            outline: none;
            transition: box-shadow 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        button {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background: #f0c445;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            color: var(--accent-gold-dim);
            font-size: 0.8rem;
            margin-top: 5px;
            align-self: flex-start;
            margin-left: 10px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gold-dim);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Agent 007</h1>
    </header>
    <div class="chat-window" id="chat-window">
        <div class="message ai-message">
            Welcome, Agent. How may I assist you today?
        </div>
    </div>
    <div class="typing-indicator" id="typing-indicator">Agent is thinking...</div>
    <form class="input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Type your command..." autocomplete="off" required>
        <button type="submit" id="send-btn">Send</button>
    </form>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    function addMessage(content, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;

        if (isUser) {
            msgDiv.textContent = content;
        } else {
            // Parse Markdown for AI response
            msgDiv.innerHTML = marked.parse(content);
        }

        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, true);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt: message })
            });

            const data = await response.json();

            if (data.status && data.result && data.result.response) {
                addMessage(data.result.response, false);
            } else {
                addMessage("Error: Mission Failed. Unable to retrieve intelligence.", false);
                console.error("API Error:", data);
            }

        } catch (error) {
            addMessage("Communication Error: Signal Lost.", false);
            console.error("Network Error:", error);
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            typingIndicator.style.display = 'none';
            userInput.focus();
        }
    });
</script>

</body>
</html>
